version: 2

models:
  - name: stg_routes
    description: One row per route, with real types.
    columns:
      - name: route_id
        description: Route id. Cast to integer.
        data_tests:
          - unique
          - not_null
      - name: campaign_id
        description: Campaign of the route. Integer.
        data_tests:
          - not_null
          - relationships:
              name: relationships_stg_routes_campaign_id
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
      - name: route_start_date
        description: Start date. Cast to date.
      - name: route_end_date
        description: End date. Cast to date.
      - name: route_status
        description: Route status, trimmed and in upper case.
        data_tests:
          - accepted_values:
              name: accepted_values_stg_routes_route_status
              arguments:
                values: ['OK', 'GRABADO']
      - name: created_at
        description: Creation date. Only a date in raw.
