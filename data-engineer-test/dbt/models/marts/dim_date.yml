version: 2

models:
  - name: dim_date
    description: >
      One row per day, from the first to the last date found in visits, campaigns and routes.
      Built with generate_series, no extra package needed. Row -1 is the unknown date.
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        description: Day as YYYYMMDD. -1 for the unknown row.
        data_type: integer
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: date_day
        description: The day. Null in the unknown row.
        data_type: date
      - name: year
        description: Calendar year.
        data_type: integer
      - name: month
        description: Month number.
        data_type: integer
      - name: week
        description: ISO week number.
        data_type: integer
      - name: day_of_week
        description: ISO day of week, 1 is Monday.
        data_type: integer
      - name: is_weekend
        description: True on Saturday and Sunday.
        data_type: boolean
        data_tests:
          - not_null
