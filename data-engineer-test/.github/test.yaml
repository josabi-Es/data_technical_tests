name: dbt tests

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths: ["dbt/**", "data/raw/**", "pyproject.toml"]
  push:
    branches: [dev]
    paths: ["dbt/**", "data/raw/**", "pyproject.toml"]

jobs:
  dbt_build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 2; done

      - name: Load raw csv files
        run: |
          uv run python - <<'EOF'
          import os
          from pathlib import Path

          import pandas as pd
          from sqlalchemy import URL, create_engine, text

          engine = create_engine(URL.create(
              "postgresql+psycopg2",
              username=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              host=os.environ["POSTGRES_HOST"],
              port=int(os.environ["POSTGRES_PORT"]),
              database=os.environ["POSTGRES_DB"],
          ))
          with engine.begin() as conn:
              conn.execute(text("create schema if not exists raw"))
          for path in sorted(Path("data/raw").glob("*.csv")):
              # all text, like Airbyte
              pd.read_csv(path, dtype=str).to_sql(path.stem, engine, schema="raw", if_exists="replace", index=False)
              print("loaded", path.stem)
          EOF

      - name: Build and test
        working-directory: dbt
        run: uv run dbt build
