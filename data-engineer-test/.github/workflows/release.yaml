name: release

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: release

jobs:
  release:
    # only merged PRs from dev
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Next tag
        id: tag
        run: |
          # highest vN plus one, v1 if none
          last=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "name=v$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --generate-notes
